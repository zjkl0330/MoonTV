# MoonTV Cloudflare Pages 配置
# 使用 Wrangler CLI 部署

name = "moon"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 构建配置（Pages Git 集成使用；wrangler 直接部署时会忽略）
[build]
command = "pnpm pages:build"
output_directory = ".vercel/output/static"

# 环境变量与 D1 绑定请在 Cloudflare Pages 控制台配置。
# 不要在这里写占位值，否则 wrangler 部署会覆盖线上已有配置。
#
# 如需由 wrangler 管理 D1 绑定，请填入真实 database_id 后取消注释：
# [[d1_databases]]
# binding = "DB"
# database_name = "moon-tv-db"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
